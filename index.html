<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d8941d" />
  <title>Study Historia — Hành trình tri thức</title>
  <style>
    :root{--paper:#fff8e8;--paper-2:#fff1cf;--ink:#302319;--muted:#776655;--line:#ecd9b5;--honey:#d8941d;--honey-2:#f3b637;--chestnut:#703d1e;--moss:#35715f;--danger:#b64f3a;--shadow:0 18px 45px rgb(101 63 20/.14);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
    [data-theme="dark"]{--paper:#221b16;--paper-2:#30261d;--ink:#fff8ed;--muted:#c9b9a1;--line:#4e3d2f;--honey:#f0b33b;--honey-2:#ffd269;--chestnut:#d77c3c;--moss:#65b595;--danger:#f48c78;--shadow:0 18px 45px rgb(0 0 0/.28)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0%,rgb(243 182 55/.17),transparent 26rem),var(--paper);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--honey-2);outline-offset:3px}.hidden{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(350px,.9fr);gap:5rem;align-items:center;padding:8vw;position:relative;overflow:hidden}.auth:before{content:"";position:absolute;inset:auto -15vw -30vw auto;width:60vw;height:60vw;border:1px solid rgb(216 148 29/.25);border-radius:50%;box-shadow:0 0 0 4rem rgb(216 148 29/.04),0 0 0 8rem rgb(216 148 29/.03)}.brand,.auth-card{position:relative;z-index:1}.brand small,.eyebrow{display:block;color:var(--honey);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.72rem}.brand h1{font-family:Georgia,serif;max-width:680px;font-size:clamp(2.8rem,6vw,5.5rem);line-height:.98;margin:.9rem 0 1.4rem;letter-spacing:-.055em}.brand p{max-width:560px;font-size:1.05rem;line-height:1.8;color:var(--muted)}.brand-lockup{display:flex;align-items:center;gap:.8rem;font-weight:900;letter-spacing:.06em}.bee{position:relative;width:35px;height:25px;border-radius:50%;background:repeating-linear-gradient(90deg,#2b2118 0 5px,#f6bd3f 5px 11px);display:inline-block;transform:rotate(-9deg);box-shadow:inset -4px -2px 0 rgb(84 53 19/.2)}.bee:before,.bee:after{content:"";position:absolute;width:16px;height:13px;border-radius:100% 0 100% 100%;background:rgb(255 255 255/.75);top:-8px}.bee:before{left:3px;transform:rotate(-25deg)}.bee:after{right:2px;transform:rotate(80deg)}.bee i{position:absolute;width:4px;height:4px;border-radius:50%;right:3px;top:8px;background:#fff}.auth-card,.panel{border:1px solid var(--line);background:color-mix(in srgb,var(--paper-2) 90%,transparent);border-radius:24px;box-shadow:var(--shadow)}.auth-card{padding:2rem;max-width:470px;width:100%}.auth-card h2{font-family:Georgia,serif;margin:.5rem 0;font-size:2.1rem}.auth-card p{color:var(--muted);line-height:1.55}.field{display:grid;gap:.45rem;margin-top:1rem;font-weight:750;font-size:.87rem}.field input,.field select,.field textarea,.control{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:.8rem .9rem;border-radius:12px}.field textarea{min-height:110px;resize:vertical}.primary,.secondary,.danger{border:0;border-radius:12px;padding:.82rem 1rem;font-weight:850;transition:transform .16s ease,filter .16s ease}.primary{background:linear-gradient(135deg,var(--honey),var(--honey-2));color:#3b260b}.secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line)}.danger{background:rgb(182 79 58/.14);color:var(--danger)}.primary:hover,.secondary:hover,.danger:hover{filter:brightness(1.04);transform:translateY(-1px)}.primary:active,.secondary:active,.danger:active{transform:scale(.98)}.wide{width:100%;margin-top:1.25rem}.auth-note{margin-top:1rem!important;padding:.8rem;border-radius:12px;background:rgb(216 148 29/.12);font-size:.8rem}.notice{min-height:1.4rem;color:var(--danger);font-size:.85rem;margin-top:.7rem}
    .app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:1.5rem;border-right:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);display:flex;flex-direction:column;gap:1.5rem}.side .brand-lockup{font-size:.84rem}.side .brand-lockup small{display:block;color:var(--muted);font-size:.62rem;margin-top:.2rem}.nav{display:grid;gap:.35rem}.nav button{border:0;background:transparent;text-align:left;color:var(--muted);padding:.75rem .8rem;border-radius:10px;font-weight:750}.nav button:hover,.nav button.active{background:rgb(216 148 29/.14);color:var(--ink)}.account-mini{margin-top:auto;border-top:1px solid var(--line);padding-top:1rem}.account-mini strong,.account-mini span{display:block}.account-mini span{font-size:.78rem;color:var(--muted);margin-top:.25rem}.main{padding:2rem clamp(1.2rem,4vw,4rem);max-width:1500px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:2rem}.topbar h1{font-family:Georgia,serif;font-size:clamp(1.7rem,3vw,2.7rem);letter-spacing:-.035em;margin:.3rem 0}.top-actions{display:flex;gap:.45rem;align-items:center}.icon{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:.55rem .65rem}.dashboard-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:1.2rem}.hero{padding:2rem;min-height:240px;background:linear-gradient(125deg,#6e3d1f,#bc762c 58%,#eeb23d);color:#fff5df;border-radius:25px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-34px;bottom:-68px;width:220px;height:220px;border-radius:50%;border:22px solid rgb(255 255 255/.14);box-shadow:0 0 0 26px rgb(255 255 255/.07)}.hero h2{font-family:Georgia,serif;font-size:clamp(1.9rem,4vw,3.4rem);max-width:650px;line-height:1;margin:.6rem 0;position:relative;z-index:1}.hero p{position:relative;z-index:1;max-width:620px;line-height:1.7}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.stat{padding:1.25rem}.stat span{color:var(--muted);font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.stat strong{font-family:Georgia,serif;font-size:2rem;display:block;margin-top:.5rem}.section{margin-top:2rem}.section-head{display:flex;justify-content:space-between;gap:1rem;align-items:end;margin-bottom:1rem}.section-head h2{font-family:Georgia,serif;font-size:1.6rem;margin:.25rem 0}.section-head p{margin:0;color:var(--muted);font-size:.9rem}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:1rem}.card{padding:1.15rem}.card h3{margin:.45rem 0;font-size:1rem}.card p{color:var(--muted);font-size:.86rem;line-height:1.55}.tag{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .52rem;border-radius:99px;background:rgb(216 148 29/.14);color:#9b610f;font-size:.72rem;font-weight:850}.bar{height:8px;border-radius:99px;background:rgb(119 102 85/.18);overflow:hidden;margin-top:.8rem}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--honey),var(--honey-2));border-radius:inherit}.empty{border:1.5px dashed var(--line);border-radius:18px;padding:2rem;text-align:center;color:var(--muted);line-height:1.7}.tabs,.filters{display:flex;gap:.55rem;flex-wrap:wrap}.tabs button,.filters button{border:1px solid var(--line);background:var(--paper);color:var(--muted);padding:.55rem .7rem;border-radius:999px;font-size:.82rem;font-weight:800}.tabs button.active,.filters button.active{background:var(--honey);color:#3b260b;border-color:var(--honey)}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.7fr);gap:1.2rem}.editor{padding:1.25rem}.editor h3{font-family:Georgia,serif;margin:.2rem 0 1rem}.stack{display:grid;gap:.7rem}.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}.row>*{flex:1}.list{display:grid;gap:.7rem}.list-item{padding:1rem;border:1px solid var(--line);border-radius:15px;background:var(--paper)}.list-item strong,.list-item small{display:block}.list-item small{margin-top:.35rem;color:var(--muted);line-height:1.45}.list-actions{display:flex;gap:.45rem;justify-content:flex-end;margin-top:.7rem}.flash{min-height:270px;perspective:1200px;cursor:pointer}.flash-inner{height:100%;min-height:270px;display:grid;place-items:center;text-align:center;border-radius:22px;border:1px solid var(--line);padding:1.6rem;background:var(--paper);box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.2,.8,.2,1)}.flash.flipped .flash-inner{transform:rotateY(180deg)}.flash .back{display:none;transform:rotateY(180deg)}.flash.flipped .front{display:none}.flash.flipped .back{display:block}.flash h3{font-family:Georgia,serif;font-size:1.8rem}.flash p{color:var(--muted);line-height:1.7}.quiz-q{padding:1.3rem}.answers{display:grid;gap:.6rem;margin-top:1rem}.answer{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:.8rem .95rem;border-radius:12px;text-align:left}.answer.selected{border-color:var(--honey);background:rgb(216 148 29/.12)}.answer.correct{background:rgb(53 113 95/.16);border-color:var(--moss)}.answer.incorrect{background:rgb(182 79 58/.12);border-color:var(--danger)}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.metric{padding:1rem}.metric b{font-size:1.45rem;font-family:Georgia,serif;display:block}.metric span{color:var(--muted);font-size:.78rem}.history-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.45rem;align-items:end;height:160px}.history-grid div{background:linear-gradient(180deg,var(--honey-2),var(--honey));border-radius:7px 7px 2px 2px;min-height:6px;position:relative}.history-grid div span{position:absolute;bottom:-1.35rem;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--muted)}.achievement{display:flex;gap:.8rem;align-items:flex-start}.medal{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--honey-2),var(--honey));color:#47300d;font-family:Georgia,serif;font-weight:900;flex:0 0 auto}.achievement.locked{opacity:.56}.title-card{display:grid;gap:.3rem;margin:.8rem 0;padding:.75rem;border:1px solid rgb(216 148 29/.35);border-radius:12px;background:linear-gradient(135deg,rgb(216 148 29/.16),rgb(255 244 200/.2))}.title-card small{color:var(--honey);font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.title-card strong{font-family:Georgia,serif;color:var(--ink)}.title-card span{color:var(--muted);font-size:.78rem;line-height:1.45}.puzzle{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:390px}.piece{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--paper-2)}.piece.held{background:linear-gradient(135deg,#ffe09a,#da9623);box-shadow:inset 0 1px 0 #fff3c9}.museum-card{min-height:180px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,rgb(112 61 30/.18),rgb(216 148 29/.08));position:relative;overflow:hidden}.museum-card:before{content:"?";font:8rem Georgia,serif;position:absolute;right:1rem;top:-1.6rem;color:rgb(112 61 30/.15)}.wheel-wrap{display:grid;place-items:center;gap:1.3rem}.wheel{width:min(72vw,350px);aspect-ratio:1;border-radius:50%;border:12px solid var(--paper);outline:2px solid var(--honey);background:conic-gradient(#f5c24c 0 25%,#a35b29 25% 50%,#74ae96 50% 75%,#f0a16b 75%);box-shadow:var(--shadow);position:relative;transition:transform 2.7s cubic-bezier(.16,.82,.18,1)}.wheel:after{content:"";position:absolute;inset:35%;border-radius:50%;background:var(--paper);border:4px solid var(--honey)}.pointer{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--chestnut);margin-bottom:-2rem;z-index:1}.admin-nav{display:flex;gap:.5rem;flex-wrap:wrap}.admin-nav button{border:1px solid var(--line);background:var(--paper);padding:.55rem .75rem;border-radius:10px;color:var(--ink);font-weight:800}.admin-nav button.active{background:var(--honey);color:#382509}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}.form-grid .full{grid-column:1/-1}.toast{position:fixed;right:1rem;bottom:1rem;background:#332519;color:#fff7e8;padding:.8rem 1rem;border-radius:12px;box-shadow:var(--shadow);max-width:350px;z-index:99}.toast.good{background:#285c4e}.toast.bad{background:#8d392b}.modal{position:fixed;inset:0;background:rgb(38 27 18/.58);display:grid;place-items:center;padding:1rem;z-index:50}.modal>div{width:min(600px,100%);max-height:90vh;overflow:auto;padding:1.5rem}.help{font-size:.78rem;color:var(--muted);line-height:1.5}.muted{color:var(--muted)}.right{text-align:right}.nowrap{white-space:nowrap}
    @media(max-width:900px){.auth{grid-template-columns:1fr;gap:2rem;padding:2rem}.auth-card{max-width:none}.app{grid-template-columns:1fr}.side{position:sticky;z-index:10;top:0;height:auto;padding:.8rem 1rem;display:flex;flex-direction:row;align-items:center;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side .brand-lockup small,.account-mini{display:none}.nav{display:flex;gap:.2rem}.nav button{white-space:nowrap;padding:.5rem .65rem}.main{padding:1.3rem}.dashboard-grid,.split{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}.topbar{align-items:start}.topbar h1{font-size:1.8rem}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main id="root"></main>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script>
  (()=>{
    const KEY='study-historia-standalone-v1';
    const $=s=>document.querySelector(s), root=$('#root');
    const today=()=>new Date().toISOString().slice(0,10), id=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2);
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const base=()=>({version:1,theme:'light',sound:true,accounts:[],profiles:{},active:null,config:{characters:[],encouragements:[{id:'correct',type:'correct',text:'Bạn đang đi đúng hướng.',enabled:true},{id:'incorrect',type:'incorrect',text:'Sai một câu là thêm một manh mối để hiểu sâu hơn.',enabled:true}],wheelRewards:[{id:'xp',label:'25 XP',kind:'xp',value:25,probability:55,color:'#d8941d'},{id:'fragment',label:'1 mảnh ghép',kind:'fragment',value:1,probability:30,color:'#35715f'},{id:'ticket',label:'1 vé quay',kind:'ticket',value:1,probability:15,color:'#b64f3a'}],customAchievements:[]}});
    let state; try{state=JSON.parse(localStorage.getItem(KEY))||base()}catch{state=base()} let view='dashboard', libraryFilter='', librarySubject='', libraryPeriod='all', studioKind='flashcard', quizSession=null, flashSession=null, adminTab='content';
    const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const toast=(msg,type='')=>{const n=$('#toast');n.textContent=msg;n.className='toast '+type;n.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.add('hidden'),3600)};
    const hash=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')};
    const account=()=>state.accounts.find(a=>a.id===state.active); const profile=()=>state.profiles[state.active];
    const blankProfile=()=>({xp:0,level:1,fragments:0,tickets:1,sets:[],attempts:[],activity:[],claimed:[],unlocked:[]});
    const rankFor=xp=>Math.max(1,Math.floor(xp/120)+1); const addActivity=(kind,amount=1,seconds=0)=>{const p=profile();p.activity.push({id:id(),date:today(),kind,amount,seconds});p.activity=p.activity.slice(-1500)};
    const award=(xp=0,fragments=0,message='')=>{const p=profile();p.xp+=xp;p.fragments+=fragments;p.level=rankFor(p.xp);save();if(message)toast(message,'good')};
    const option=(value,label,selected)=>`<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(label)}</option>`;
    const nav=[['dashboard','Tổng quan'],['studio','AI Studio'],['library','Flashcard'],['quiz','Đề kiểm tra'],['progress','Tiến trình'],['achievements','Thành tích'],['museum','Bảo tàng'],['wheel','Vòng quay'],['account','Tài khoản'],['admin','Quản trị']];
    const appShell=(content,title,eyebrow='Hành trình tri thức')=>`<div class="app"><aside class="side"><div class="brand-lockup"><span class="bee" aria-hidden="true"><i></i></span><div>STUDY HISTORIA<small>Hành trình tri thức</small></div></div><nav class="nav" aria-label="Điều hướng chính">${nav.filter(n=>n[0]!=='admin'||['Admin','Founder'].includes(account().role)).map(n=>`<button data-view="${n[0]}" class="${view===n[0]?'active':''}">${n[1]}</button>`).join('')}</nav><div class="account-mini"><strong>${esc(account().name)}</strong><span>${esc(account().role)} · Cấp ${profile().level}</span></div></aside><section class="main"><header class="topbar"><div><span class="eyebrow">${eyebrow}</span><h1>${title}</h1></div><div class="top-actions"><button class="icon" id="sound" aria-label="Bật hoặc tắt âm thanh">${state.sound?'Âm thanh: bật':'Âm thanh: tắt'}</button><button class="icon" id="theme" aria-label="Đổi chế độ sáng tối">${state.theme==='dark'?'Sáng':'Tối'}</button></div></header>${content}</section></div>`;
    function login(){root.innerHTML=`<section class="auth"><div class="brand"><div class="brand-lockup"><span class="bee" aria-hidden="true"><i></i></span><div>STUDY HISTORIA<br><small>Hành trình tri thức</small></div></div><span class="eyebrow" style="margin-top:4rem;color:#f3c458">Học · chinh phục · khám phá</span><h1>Mỗi lần học là một bước mở khóa câu chuyện.</h1><p>Flashcard, kiểm tra và hành trình khám phá lịch sử Việt Nam được kết nối trong một không gian riêng cho từng thành viên.</p></div><form class="auth-card" id="login-form"><span class="eyebrow">Phiên học riêng tư</span><h2>${state.accounts.length?'Chào mừng trở lại':'Thiết lập hành trình'}</h2><p>${state.accounts.length?'Đăng nhập bằng tên, mật khẩu và mã tài khoản.':'Người đầu tiên được tạo với vai trò Founder để khởi tạo không gian học tập.'}</p><label class="field">Tên thành viên<input required name="name" autocomplete="username" placeholder="Ví dụ: Nguyễn Văn An" /></label><label class="field">Mật khẩu<input required name="password" type="password" minlength="6" autocomplete="current-password" placeholder="Tối thiểu 6 ký tự" /></label><label class="field">Mã tài khoản<input required name="code" maxlength="32" placeholder="Ví dụ: TV-1001 hoặc 111" /></label><button class="primary wide" type="submit">${state.accounts.length?'Đăng nhập vào hành trình':'Tạo Founder và bắt đầu'}</button><p id="login-note" class="auth-note">${state.accounts.length?'Không có tài khoản? Hãy liên hệ Admin hoặc Founder để được cấp mã.':'Bản HTML tự chứa chỉ lưu dữ liệu cục bộ trên thiết bị này, không đồng bộ máy chủ; hãy dùng Export JSON để sao lưu.'}</p><div class="notice" id="login-error"></div></form></section>`;$('#login-form').onsubmit=loginSubmit}
    async function loginSubmit(e){e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')).trim(),code=String(f.get('code')).trim().toUpperCase(),password=String(f.get('password')),error=$('#login-error');if(!name||!code)return;const pwd=await hash(password);if(!state.accounts.length){const a={id:id(),name,code,hash:pwd,role:'Founder',createdAt:new Date().toISOString()};state.accounts.push(a);state.profiles[a.id]=blankProfile();state.active=a.id;save();toast('Đã tạo Founder. Hãy bắt đầu cấu hình nội dung.','good');render();return}const a=state.accounts.find(x=>x.code===code&&x.name.toLowerCase()===name.toLowerCase()&&x.hash===pwd);if(!a){error.textContent='Không khớp tên, mật khẩu hoặc mã tài khoản.';return}state.active=a.id;save();render()}
    const stat=(label,value)=>`<div class="panel stat"><span>${label}</span><strong>${value}</strong></div>`;
    function dashboard(){const p=profile(), latest=p.activity.slice(-6).reverse(), accuracy=p.attempts.length?Math.round(p.attempts.reduce((s,a)=>s+a.score,0)/p.attempts.length):0;return appShell(`<div class="dashboard-grid"><section class="hero"><span class="eyebrow" style="color:#ffedb2">Không gian học tập riêng</span><h2>Chào ${esc(account().name)}, hôm nay bạn muốn mở khóa điều gì?</h2><p>Tiến trình chỉ tổng hợp từ dữ liệu bạn tự tạo: bộ thẻ, đề kiểm tra, kết quả và các lần ôn tập.</p><div class="row" style="max-width:440px;margin-top:1.2rem"><button class="secondary" data-go="studio">Mở AI Studio</button><button class="secondary" data-go="library">Ôn Flashcard</button></div></section><div class="stat-grid">${stat('XP hiện có',p.xp)}${stat('Cấp độ',p.level)}${stat('Mảnh ghép',p.fragments)}${stat('Độ chính xác',accuracy+'%')}</div></div><section class="section"><div class="section-head"><div><span class="eyebrow">Nhịp học</span><h2>Hoạt động gần đây</h2></div><button class="secondary" data-go="progress">Xem Tiến trình</button></div>${latest.length?`<div class="cards">${latest.map(a=>`<article class="panel card"><span class="tag">${a.kind==='quiz'?'Đề kiểm tra':a.kind==='flashcard'?'Flashcard':'Phần thưởng'}</span><h3>${a.amount} ${a.kind==='quiz'?'câu đã nộp':a.kind==='flashcard'?'thẻ đã luyện':'lần nhận thưởng'}</h3><p>${esc(a.date)}${a.seconds?` · ${Math.ceil(a.seconds/60)} phút`:''}</p></article>`).join('')}</div>`:`<div class="empty">Chưa có hoạt động. Tạo bộ Flashcard hoặc đề kiểm tra đầu tiên để bắt đầu ghi nhận hành trình.</div>`}</section><section class="section"><div class="section-head"><div><span class="eyebrow">Lối tắt</span><h2>Học theo cách bạn chọn</h2></div></div><div class="cards"><article class="panel card"><span class="tag">Từ ý tưởng đến bộ thẻ</span><h3>AI Studio</h3><p>Soạn prompt, dán JSON AI phản hồi và giới hạn tối đa 27 thẻ mỗi lần nhập.</p><button class="secondary" data-go="studio">Tạo nội dung</button></article><article class="panel card"><span class="tag">Kết nối kiến thức</span><h3>Vòng quay Tri thức</h3><p>Nhận XP, mảnh ghép hoặc vé quay theo cấu hình chung.</p><button class="secondary" data-go="wheel">Quay vòng</button></article><article class="panel card"><span class="tag">Khám phá</span><h3>Bảo tàng Hành trình</h3><p>Nhân vật do Admin nhập có nguồn; không có dữ liệu nhân vật mặc định.</p><button class="secondary" data-go="museum">Vào bảo tàng</button></article></div></section>`,'Tổng quan')}
    function studio(){return appShell(`<div class="split"><section class="panel editor"><span class="eyebrow">Tạo nội dung có kiểm soát</span><h3>AI Studio</h3><div class="tabs" role="tablist"><button class="${studioKind==='flashcard'?'active':''}" data-kind="flashcard">Flashcard</button><button class="${studioKind==='quiz'?'active':''}" data-kind="quiz">Đề kiểm tra</button><button class="${studioKind==='both'?'active':''}" data-kind="both">Tạo cả hai</button></div><form id="studio-form" class="stack" style="margin-top:1rem"><label class="field">Môn học<input required name="subject" placeholder="Ví dụ: Lịch sử Việt Nam" /></label><label class="field">Mục đích học<input required name="goal" placeholder="Ví dụ: Ôn thi cuối kỳ, nhớ mốc thời gian" /></label><div class="form-grid"><label class="field">Lớp / cấp học<input name="grade" placeholder="Ví dụ: Lớp 10" /></label><label class="field">Mức độ<select name="difficulty"><option>Cơ bản</option><option>Trung bình</option><option>Nâng cao</option></select></label></div><label class="field">Tài liệu hoặc yêu cầu chi tiết<textarea name="source" required placeholder="Dán nội dung, tóm tắt chương hoặc yêu cầu học tại đây."></textarea></label><label class="field">Tải TXT, MD hoặc PDF<input id="studio-file" name="source-file" type="file" accept=".txt,.md,.pdf,text/plain,text/markdown,application/pdf" /><small id="studio-file-note" class="help">TXT/MD được đọc trực tiếp; PDF được giữ làm nguồn tài liệu.</small></label><div class="form-grid"><label class="field">Số mục tối đa<input name="count" type="number" min="1" max="27" value="12" /></label><label class="field">Thời gian Quiz (phút)<input name="minutes" type="number" min="1" max="180" value="15" /></label></div><button class="primary" type="submit">Tạo prompt ${studioKind==='both'?'cho cả hai':''}</button></form></section><aside class="panel editor"><span class="eyebrow">Bước 2</span><h3>Nhập phản hồi JSON</h3><p class="help">Dán JSON trả về từ AI. Flashcard: <code>{"title":"…","cards":[{"front":"…","back":"…"}]}</code>. Quiz: <code>{"title":"…","questions":[{"text":"…","options":["…"],"answer":0,"explanation":"…"}]}</code>.</p><label class="field">Phản hồi JSON<textarea id="json-input" placeholder="Dán JSON hợp lệ tại đây"></textarea></label><button class="primary wide" id="import-ai">Phân tích và lưu vào thư viện</button><p class="help">Tối đa 27 thẻ/câu mỗi lần. Dữ liệu chỉ được lưu sau khi JSON hợp lệ.</p><label class="field" style="margin-top:1rem">Prompt AI có thể chỉnh sửa<textarea id="prompt-output" class="hidden" rows="10" aria-label="Prompt AI có thể chỉnh sửa"></textarea></label><div class="row hidden" id="prompt-actions" style="margin-top:.6rem"><button class="secondary" type="button" id="regenerate-prompt">Tạo lại prompt</button><button class="secondary" type="button" id="copy-prompt">Sao chép prompt</button></div></aside></div>`,'AI Studio','Tạo bộ học theo nhu cầu')}
    function library(){const p=profile(),subjects=[...new Set(p.sets.map(s=>s.subject||'Chưa phân môn'))].sort(),withinPeriod=s=>{if(libraryPeriod==='all')return true;const made=new Date(s.createdAt),now=new Date(),days=libraryPeriod==='today'?0:libraryPeriod==='week'?7:30;return libraryPeriod==='today'?made.toDateString()===now.toDateString():now-made<=days*86400000},sets=p.sets.filter(s=>(!libraryFilter||s.subject.toLowerCase().includes(libraryFilter)||s.title.toLowerCase().includes(libraryFilter))&&(!librarySubject||s.subject===librarySubject)&&withinPeriod(s));if(flashSession)return flashView();return appShell(`<section class="panel editor"><div class="section-head"><div><span class="eyebrow">Thư viện cá nhân</span><h3>Bộ Flashcard</h3><p>Tìm, lọc, đổi tên, sao chép, xóa hoặc biến một bộ thẻ thành đề kiểm tra.</p></div><input id="set-filter" class="control" style="max-width:260px" value="${esc(libraryFilter)}" placeholder="Tìm theo tên hoặc môn" /></div><div class="filters"><button class="${!librarySubject?'active':''}" data-subject="">Tất cả môn</button>${subjects.map(subject=>`<button class="${librarySubject===subject?'active':''}" data-subject="${esc(subject)}">${esc(subject)}</button>`).join('')}<button class="${libraryPeriod==='today'?'active':''}" data-period="today">Hôm nay</button><button class="${libraryPeriod==='week'?'active':''}" data-period="week">7 ngày</button><button class="${libraryPeriod==='month'?'active':''}" data-period="month">30 ngày</button><button class="${libraryPeriod==='all'?'active':''}" data-period="all">Mọi ngày</button><button data-go="studio">Tạo bộ mới</button></div></section><section class="section">${sets.length?`<div class="cards">${sets.map(s=>`<article class="panel card"><span class="tag">${esc(s.subject||'Chưa phân môn')}</span><h3>${esc(s.title)}</h3><p>${s.cards.length} thẻ · tạo ${esc(s.createdAt.slice(0,10))}</p><div class="bar"><i style="width:${Math.round((s.learned||0)/Math.max(1,s.cards.length)*100)}%"></i></div><small class="muted">Đã nhớ ${s.learned||0}/${s.cards.length}</small><div class="list-actions"><button class="secondary" data-study="${s.id}">Học</button><button class="secondary" data-quiz-set="${s.id}">Tạo đề</button><button class="secondary" data-rename-set="${s.id}">Đổi tên</button><button class="secondary" data-copy-set="${s.id}">Sao chép</button><button class="danger" data-delete-set="${s.id}">Xóa</button></div></article>`).join('')}</div>`:`<div class="empty">Không có bộ Flashcard phù hợp bộ lọc hiện tại.</div>`}</section>`,'Flashcard','Ôn lặp lại để ghi nhớ')}
    function flashView(){const s=profile().sets.find(x=>x.id===flashSession.setId);if(!s||!s.cards.length){flashSession=null;return library()}const c=s.cards[flashSession.index],choices=[...new Set([c.back,...s.cards.filter((_,i)=>i!==flashSession.index).map(x=>x.back).sort(()=>Math.random()-.5).slice(0,3)])].sort(()=>Math.random()-.5),mode=flashSession.mode,practice=mode===0?`<article class="flash ${flashSession.flip?'flipped':''}" id="flash-card" style="margin-top:1rem"><div class="flash-inner"><div class="front"><span class="eyebrow">Mặt trước · ${flashSession.index+1}/${s.cards.length}</span><h3>${esc(c.front)}</h3><p>Nhấn vào thẻ để lật và xem đáp án.</p></div><div class="back"><span class="eyebrow">Mặt sau</span><h3>${esc(c.back)}</h3><p>${c.note?esc(c.note):'Tự đánh giá mức độ ghi nhớ ở bước tiếp theo.'}</p></div></div></article>`:mode===1?`<section class="panel" style="margin-top:1rem"><span class="eyebrow">Chọn đáp án đúng</span><h3>${esc(c.front)}</h3><div class="answers">${choices.map(o=>`<button class="answer" data-flash-choice="${esc(o)}">${esc(o)}</button>`).join('')}</div></section>`:mode===2?`<section class="panel" style="margin-top:1rem"><span class="eyebrow">Gõ đáp án</span><h3>${esc(c.front)}</h3><label class="field">Đáp án của bạn<input id="typed-answer" autocomplete="off" placeholder="Nhập câu trả lời" /></label><button class="primary" id="check-typed">Kiểm tra đáp án</button></section>`:`<section class="panel" style="margin-top:1rem"><span class="eyebrow">Ghép cặp</span><h3>${esc(c.front)}</h3><label class="field">Ghép với đáp án<select id="match-answer">${choices.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></label><button class="primary" id="check-match">Kiểm tra cặp ghép</button></section>`;return appShell(`<section class="panel editor"><div class="section-head"><div><span class="eyebrow">${esc(s.title)}</span><h3>Chế độ: ${['Lật thẻ','Trắc nghiệm','Gõ đáp án','Ghép đôi'][mode]}</h3></div><button class="secondary" id="end-flash">Kết thúc phiên</button></div><div class="tabs">${['Lật thẻ','Trắc nghiệm','Gõ đáp án','Ghép đôi'].map((m,i)=>`<button class="${mode===i?'active':''}" data-flash-mode="${i}">${m}</button>`).join('')}</div>${practice}<div class="row" style="margin-top:1rem"><button class="secondary" id="flash-prev">Trước</button><button class="danger" data-rate="0">Chưa nhớ</button><button class="primary" data-rate="1">Đã nhớ</button><button class="secondary" id="flash-next">Tiếp</button></div></section>`,'Phiên học Flashcard','Ôn tập có chủ đích')}
    function quiz(){if(quizSession)return quizView();const quizzes=profile().sets.filter(s=>s.quiz);return appShell(`<section class="panel editor"><span class="eyebrow">Đề kiểm tra của bạn</span><h3>Chọn một đề để bắt đầu</h3><p class="muted">Đề được tạo từ JSON AI hoặc từ bộ Flashcard của chính bạn. Không có câu hỏi mẫu cố định.</p></section><section class="section">${quizzes.length?`<div class="cards">${quizzes.map(s=>`<article class="panel card"><span class="tag">${esc(s.subject||'Tự tạo')}</span><h3>${esc(s.quiz.title)}</h3><p>${s.quiz.questions.length} câu · ${s.quiz.minutes||15} phút</p><button class="primary" data-start-quiz="${s.id}">Làm đề</button></article>`).join('')}</div>`:`<div class="empty">Chưa có đề. Tạo Quiz ở AI Studio hoặc nhấn “Tạo đề” từ một bộ Flashcard.</div>`}</section>`,'Đề kiểm tra','Làm bài, đánh dấu câu và xem lại kết quả')}
    function quizView(){const s=profile().sets.find(x=>x.id===quizSession.setId),q=s.quiz.questions[quizSession.index],answered=quizSession.answers[quizSession.index];return appShell(`<section class="panel quiz-q"><div class="section-head"><div><span class="eyebrow">${esc(s.quiz.title)}</span><h3>Câu ${quizSession.index+1}/${s.quiz.questions.length}</h3></div><div class="right"><strong id="timer">${timeLeft()}</strong><br><button class="secondary" id="flag">${quizSession.flagged.includes(quizSession.index)?'Bỏ đánh dấu':'Đánh dấu câu'}</button></div></div><p style="font-size:1.1rem;line-height:1.65">${esc(q.text)}</p><div class="answers">${q.options.map((o,i)=>`<button class="answer ${answered===i?'selected':''}" data-answer="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="row" style="margin-top:1.2rem"><button class="secondary" id="quiz-prev">Trước</button><button class="secondary" id="quiz-next">Tiếp</button><button class="primary" id="submit-quiz">Nộp bài</button></div><div class="filters" style="margin-top:1rem">${s.quiz.questions.map((_,i)=>`<button class="${i===quizSession.index?'active':''}" data-jump="${i}">${i+1}${quizSession.flagged.includes(i)?' ⚑':''}</button>`).join('')}</div></section>`,'Đề kiểm tra','Tập trung vào từng câu hỏi')}
    const timeLeft=()=>{if(!quizSession)return'';const n=Math.max(0,Math.ceil((quizSession.end-Date.now())/1000));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
    function resultView(result){return appShell(`<section class="panel editor"><span class="eyebrow">Kết quả đề</span><h2 style="font-family:Georgia,serif;font-size:2.6rem;margin:.4rem 0">${result.score10}/10</h2><p class="muted">${result.correct}/${result.total} câu đúng · ${result.skipped} bỏ qua · ${result.flagged.length} câu từng đánh dấu</p><div class="row" style="margin-top:1rem"><button class="primary" id="retry-quiz">Làm lại</button><button class="secondary" id="make-wrong-cards">Tạo Flashcard từ câu sai</button><button class="secondary" data-go="quiz">Về danh sách đề</button></div><section class="section"><div class="section-head"><div><span class="eyebrow">Xem lại và học lại</span><h2>Giải thích từng câu</h2></div></div><div class="list">${result.questions.map((q,i)=>{const a=result.answers[i],ok=a===q.answer;return `<article class="list-item"><span class="tag" style="background:${ok?'rgb(53 113 95/.16)':'rgb(182 79 58/.12)'}">${ok?'Đúng':a===undefined?'Bỏ qua':'Chưa đúng'}</span><h3>${i+1}. ${esc(q.text)}</h3><small>Đáp án đúng: ${esc(q.options[q.answer])}${q.explanation?` · ${esc(q.explanation)}`:''}</small></article>`}).join('')}</div></section></section>`,'Đã hoàn thành','Kết quả và gợi ý học lại')}
    function progress(){const p=profile(),days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10)}),counts=days.map(d=>p.activity.filter(a=>a.date===d).reduce((s,a)=>s+a.amount,0)),secs=p.activity.reduce((s,a)=>s+(a.seconds||0),0),avg=p.attempts.length?Math.round(p.attempts.reduce((s,a)=>s+a.score,0)/p.attempts.length):0;return appShell(`<section class="metric-grid">${stat('Tổng XP',p.xp)}${stat('Thời gian Quiz',Math.ceil(secs/60)+' phút')}${stat('Điểm TB',avg+'%')}${stat('Chuỗi hôm nay',p.activity.some(a=>a.date===today())?'1 ngày':'0 ngày')}</section><section class="panel editor section"><span class="eyebrow">7 ngày gần đây</span><h3>Nhịp học từ hoạt động thực tế</h3><div class="history-grid">${counts.map((c,i)=>`<div style="height:${Math.max(6,c*18)}px"><span>${days[i].slice(8)}</span></div>`).join('')}</div></section><section class="section"><div class="section-head"><div><span class="eyebrow">Nhật ký học</span><h2>Gần đây</h2></div></div>${p.activity.length?`<div class="list">${p.activity.slice(-12).reverse().map(a=>`<article class="list-item"><strong>${a.kind==='quiz'?'Đã làm đề kiểm tra':a.kind==='flashcard'?'Đã luyện Flashcard':'Đã nhận phần thưởng'}</strong><small>${a.date} · ${a.amount} đơn vị${a.seconds?` · ${Math.ceil(a.seconds/60)} phút`:''}</small></article>`).join('')}</div>`:`<div class="empty">Khi bạn học Flashcard hoặc nộp Quiz, hoạt động sẽ xuất hiện tại đây.</div>`}</section>`,'Tiến trình','Chỉ số cá nhân, không xếp hạng công khai')}
    const standaloneTitleSeeds=['Người Bắt Đầu Con Đường','Bước Chân Đầu Tiên','Mầm Tri Thức','Người Gieo Hạt','Ánh Sáng Đầu Ngày','Người Không Bỏ Cuộc','Kẻ Bền Chí','Người Rèn Ý Chí','Bước Chậm Mà Chắc','Người Đi Đến Cùng','Ong Chăm Chỉ','Ong Góp Nhặt Tri Thức','Người Thợ Xây Tổ','Người Gom Từng Giọt Mật','Ong Không Ngừng Bay','Người Giữ Ngọn Đèn','Lửa Học Bền Lâu','Ánh Đèn Bên Trang Sách','Người Soi Đường','Đốm Sáng Không Tàn','Có Công Mài Sắt','Kiến Tha Lâu Đầy Tổ','Nước Chảy Đá Mòn','Học Thầy Học Bạn','Góp Gió Thành Bão','Người Vượt Dốc','Kẻ Băng Qua Mưa Gió','Người Mở Lối','Bản Lĩnh Đường Xa','Người Vươn Tới','Hạt Mầm Vươn Cành','Cánh Chim Tri Thức','Dòng Sông Kiến Văn','Ngọn Núi Bền Gan','Vầng Trăng Học Hỏi','Người Dệt Mạng Hiểu Biết','Kẻ Thuần Hóa Thử Thách','Người Chạm Chân Trời','Bậc Thầy Tích Lũy','Người Gọi Bình Minh'],standaloneTitleRanks=['Khởi Sắc','Bền Chí','Tiến Hóa','Tinh Anh','Cao Quý','Vô Cực','Truyền Thuyết','Huyền Thoại','Rạng Danh','Tối Thượng'];
    const generatedAchievements=()=>Array.from({length:900},(_,i)=>{const tier=Math.floor(i/100)+1,late=tier>=6,metric=['xp','sets','quizzes','cards'][i%4],growth=Math.pow(1.055,i%100)*Math.pow(tier,1.55),base=metric==='xp'?250:metric==='cards'?10:metric==='quizzes'?3:2,threshold=i>=500?Math.max(1,Math.round(base*Math.pow(1.055,Math.floor((i-500)/4)))+Math.floor((i-500)/4)):Math.max(1,Math.round(base*growth)),special=i-500,title=i===899?'Người Giữ Ngọn Lửa Tri Thức':late?`${standaloneTitleSeeds[special%standaloneTitleSeeds.length]} · ${standaloneTitleRanks[Math.floor(special/standaloneTitleSeeds.length)%standaloneTitleRanks.length]}`:null;return{id:'base-'+i,name:late?title:`Mốc học tập ${i+1}`,description:`Đạt ${threshold} ${metric==='xp'?'XP':metric==='sets'?'bộ học':metric==='quizzes'?'đề hoàn thành':'thẻ đã luyện'}.`,tier,metric,threshold,kind:late?'Danh hiệu':'Thành tích',title,titleMeaning:title?`Danh hiệu ${standaloneTitleRanks[Math.floor(special/standaloneTitleSeeds.length)%standaloneTitleRanks.length].toLowerCase()} #${special+1}, dành cho người biến từng lần ôn tập thành một bước tiến riêng${i===899?' và đã hoàn thành toàn bộ hành trình 900 mốc.':'.'}`:null,difficulty:tier===9?'Huyền thoại':tier>=7?'Cực khó':tier>=5?'Khó':tier>=3?'Bình thường':'Dễ',rewardXp:20+(tier-1)*25+Math.floor((i%100)/10)*5,rewardFragments:i%20===19?1:0}});
    function valueFor(metric){const p=profile();return metric==='xp'?p.xp:metric==='sets'?p.sets.length:metric==='quizzes'?p.attempts.length:p.sets.reduce((s,x)=>s+(x.learned||0),0)}
    function achievements(){const all=[...generatedAchievements(),...state.config.customAchievements.map(x=>({...x,tier:9,kind:'Thành tích tùy chỉnh',title:null,rewardFragments:x.rewardFragments||0}))],p=profile(),available=all.filter(a=>valueFor(a.metric)>=a.threshold),filter=window._achFilter||'all',status=window._achStatus||'all',titleOnly=Boolean(window._achTitleOnly),difficulty=window._achDifficulty||'all',fragmentOnly=Boolean(window._achFragmentOnly),query=window._achQuery||'',shown=all.filter(a=>(filter==='all'||a.tier===Number(filter))&&(status==='all'||(status==='open'?valueFor(a.metric)>=a.threshold:valueFor(a.metric)<a.threshold))&&(difficulty==='all'||a.difficulty===difficulty)&&(!fragmentOnly||a.rewardFragments>0)&&(!titleOnly||Boolean(a.title))&&(!query||`${a.name} ${a.title||''} ${a.description}`.toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'))));return appShell(`<section class="panel editor"><span class="eyebrow">900 mốc và danh hiệu</span><h3>Bộ sưu tập thành tích và danh hiệu</h3><p class="muted">9 bậc, mỗi bậc 100 mục. 500 mốc đầu trao huy hiệu/XP/mảnh ghép; 400 mốc cuối là 400 danh hiệu riêng biệt. Đã đạt: ${available.length}/${all.length}.</p><div class="filters" style="margin-top:1rem"><input id="ach-search" value="${esc(query)}" placeholder="Tìm thành tích hoặc danh hiệu…" aria-label="Tìm thành tích hoặc danh hiệu"><select id="ach-status" aria-label="Lọc trạng thái"><option value="all" ${status==='all'?'selected':''}>Tất cả</option><option value="open" ${status==='open'?'selected':''}>Đã mở khóa</option><option value="locked" ${status==='locked'?'selected':''}>Chưa mở khóa</option></select><select id="ach-difficulty" aria-label="Lọc độ khó"><option value="all" ${difficulty==='all'?'selected':''}>Mọi độ khó</option>${['Dễ','Bình thường','Khó','Rất khó','Cực khó','Huyền thoại'].map(x=>`<option value="${x}" ${difficulty===x?'selected':''}>${x}</option>`).join('')}</select><label class="check"><input id="ach-title" type="checkbox" ${titleOnly?'checked':''}> Có danh hiệu</label><label class="check"><input id="ach-fragments" type="checkbox" ${fragmentOnly?'checked':''}> Có mảnh ghép</label><button class="${filter==='all'?'active':''}" data-ach-filter="all">Tất cả bậc</button>${Array.from({length:9},(_,i)=>`<button class="${filter===i+1?'active':''}" data-ach-filter="${i+1}">Bậc ${i+1}</button>`).join('')}</div></section><section class="section"><p class="muted">Đang hiển thị ${shown.length}/${all.length} mục · ${shown.filter(a=>a.title).length} danh hiệu</p><div class="cards">${shown.map(a=>{const got=valueFor(a.metric)>=a.threshold,claimed=p.claimed.includes(a.id);return `<article class="panel card achievement ${got?'':'locked'}"><div class="medal">${got?(a.tier===9?'🐝':a.tier):'🔒'}</div><div><span class="tag">${esc(a.kind)} · Bậc ${a.tier} · ${esc(a.difficulty||'Bình thường')}</span><h3>${esc(got?a.name:'Một cột mốc đang chờ Ong')}</h3><p>${esc(got?a.description:'Mở khóa để khám phá điều kiện và phần thưởng.')}</p>${got&&a.title?`<div class="title-card"><small>Danh hiệu riêng</small><strong>${esc(a.title)}</strong><span>${esc(a.titleMeaning||'Danh hiệu đại diện cho một chặng học đáng nhớ.')}</span></div>`:''}${got?`<button class="${claimed?'secondary':'primary'}" ${claimed?'disabled':''} data-claim="${a.id}">${claimed?'Đã nhận':'Nhận +'+(a.rewardXp||a.tier*5)+' XP'}${a.rewardFragments?' · '+a.rewardFragments+' mảnh':''}</button>`:'<small class="muted">Tiến trình: '+valueFor(a.metric)+'/'+a.threshold+'</small>'}</div></article>`}).join('')}</div></section>`,'Thành tích','Mỗi phần thưởng chỉ nhận một lần')}
    function museum(){const p=profile(),chars=state.config.characters;return appShell(`<section class="split"><div class="panel editor"><span class="eyebrow">Bản đồ mảnh ghép</span><h3>${p.fragments} mảnh ghép đang có</h3><p class="muted">Mảnh ghép đến từ học Flashcard, làm đề, thành tích và vòng quay. Chỉ khi đủ theo yêu cầu của nhân vật, nội dung lịch sử mới được mở khóa.</p><div class="puzzle" aria-label="Bản đồ mảnh ghép" style="margin-top:1rem">${Array.from({length:16},(_,i)=>`<i class="piece ${i<p.fragments?'held':''}"></i>`).join('')}</div></div><aside class="panel editor"><span class="eyebrow">Quy tắc mở khóa</span><h3>Ghép hình và khám phá</h3><p class="muted">Admin/Founder cung cấp dữ liệu nhân vật, nguồn tham khảo, ảnh và timeline có kiểm chứng. Bản tự chứa không cài sẵn bất kỳ nhân vật lịch sử nào.</p></aside></section><section class="section">${chars.length?`<div class="cards">${chars.map(c=>{const open=p.unlocked.includes(c.id)||p.fragments>=c.fragmentTotal;return `<article class="panel card museum-card"><span class="tag">${open?'Đã mở khóa':'Cần '+c.fragmentTotal+' mảnh'}</span><h3>${open?esc(c.name):'Nhân vật bị khóa'}</h3><p>${open?esc(c.summary||c.role||'Chưa có tóm tắt.'):'Tiếp tục học để ghép đủ mảnh.'}</p>${open?`<button class="secondary" data-character="${c.id}">Xem câu chuyện</button>`:''}</article>`}).join('')}</div>`:`<div class="empty">Bảo tàng chưa có nhân vật. Admin/Founder có thể nhập JSON có nguồn trong mục Quản trị.</div>`}</section>`,'Bảo tàng Hành trình','Mở khóa từng câu chuyện lịch sử')}
    function character(c){return appShell(`<section class="panel editor"><button class="secondary" data-go="museum">← Về Bảo tàng</button><span class="eyebrow" style="margin-top:1rem">${esc(c.role||'Nhân vật lịch sử')}</span><h2 style="font-family:Georgia,serif;font-size:2.6rem;margin:.5rem 0">${esc(c.name)}</h2><p class="muted">${esc(c.birthYear||'?')} — ${esc(c.deathYear||'?')} · ${esc(c.hometown||'Chưa cập nhật quê quán')}</p><p style="line-height:1.8;max-width:800px">${esc(c.biography||c.summary||'Admin chưa bổ sung tiểu sử.')}</p><section class="section"><h3>Timeline</h3>${(c.timeline||[]).length?`<div class="list">${c.timeline.map(t=>`<article class="list-item"><strong>${esc(t.year)}</strong><small>${esc(t.event)}</small></article>`).join('')}</div>`:'<p class="muted">Chưa có timeline.</p>'}</section><section class="section"><h3>Nguồn tham khảo</h3>${c.sourceUrl?`<a href="${esc(c.sourceUrl)}" target="_blank" rel="noreferrer">${esc(c.sourceName||c.sourceUrl)}</a>`:'<p class="muted">Admin chưa bổ sung nguồn liên kết.</p>'}</section></section>`,'Câu chuyện lịch sử','Bảo tàng Hành trình')}
    function wheel(){const p=profile(),rewards=state.config.wheelRewards;return appShell(`<section class="split"><div class="panel editor wheel-wrap"><div class="pointer" aria-hidden="true"></div><div class="wheel" id="wheel" aria-label="Vòng quay Tri thức"></div><p class="muted">Bạn có <b>${p.tickets}</b> vé quay.</p><button class="primary" id="spin" ${p.tickets?'':'disabled'}>${p.tickets?'Quay vòng':'Hết vé quay'}</button><div id="spin-result" class="help"></div></div><aside class="panel editor"><span class="eyebrow">Phần thưởng có xác suất</span><h3>Vòng quay Tri thức</h3><div class="list">${rewards.map(r=>`<article class="list-item"><span class="tag" style="background:${esc(r.color)}33">${r.probability}%</span><strong>${esc(r.label)}</strong><small>${esc(r.kind)} · giá trị ${r.value}</small></article>`).join('')}</div></aside></section>`,'Vòng quay Tri thức','Nhịp game hóa phục vụ việc học')}
    function accountView(){return appShell(`<div class="split"><section class="panel editor"><span class="eyebrow">Hồ sơ cá nhân</span><h3>${esc(account().name)}</h3><p class="muted">${esc(account().role)} · Mã ${esc(account().code)}</p><p>Dữ liệu của bạn được tách theo mã tài khoản trong bản HTML này.</p></section><aside class="panel editor"><span class="eyebrow">Sao lưu an toàn</span><h3>Xuất hoặc nhập JSON</h3><p class="help">Tệp chỉ gồm dữ liệu học tập của tài khoản hiện tại, không bao gồm mật khẩu và dữ liệu thành viên khác.</p><div class="row"><button class="primary" id="export">Xuất JSON</button><label class="secondary" style="text-align:center">Nhập JSON<input id="import" type="file" accept="application/json" class="sr" /></label></div></aside></div><section class="section"><button class="danger" id="logout">Đăng xuất</button></section>`,'Tài khoản','Quyền riêng tư và sao lưu')}
    function admin(){if(!['Admin','Founder'].includes(account().role))return dashboard();return appShell(`<section class="panel editor"><span class="eyebrow">Admin / Founder</span><h3>Quản trị nội dung và thành viên</h3><div class="admin-nav"><button class="${adminTab==='content'?'active':''}" data-admin="content">Nội dung</button><button class="${adminTab==='characters'?'active':''}" data-admin="characters">Nhân vật</button><button class="${adminTab==='wheel'?'active':''}" data-admin="wheel">Vòng quay</button><button class="${adminTab==='accounts'?'active':''}" data-admin="accounts">Thành viên</button></div></section><section class="section">${adminBody()}</section>`,'Quản trị','Cấu hình chung, dữ liệu cá nhân vẫn cô lập')}
    function adminBody(){const founder=account().role==='Founder';if(adminTab==='content')return `<div class="split"><form class="panel editor" id="enc-form"><span class="eyebrow">Lời động viên</span><h3>Thêm / thay thế nội dung</h3><label class="field">Câu động viên<textarea required name="text" placeholder="Nội dung phản hồi khi trả lời đúng hoặc chưa đúng"></textarea></label><label class="field">Tình huống<select name="type"><option value="correct">Trả lời đúng</option><option value="incorrect">Trả lời chưa đúng</option></select></label><button class="primary wide">Thêm lời động viên</button></form><form class="panel editor" id="ach-form"><span class="eyebrow">Mốc tùy chỉnh</span><h3>Thêm thành tích</h3><div class="form-grid"><label class="field">Tên<input required name="name" /></label><label class="field">Chỉ số<select name="metric"><option value="xp">XP</option><option value="sets">Bộ học</option><option value="quizzes">Đề hoàn thành</option><option value="cards">Thẻ đã nhớ</option></select></label><label class="field">Mốc<input required type="number" name="threshold" min="1" /></label><label class="field">XP thưởng<input required type="number" name="rewardXp" min="0" value="30" /></label></div><button class="primary wide">Thêm thành tích</button></form></div><section class="section"><h3>Nội dung đang dùng</h3><div class="list">${state.config.encouragements.map(x=>`<article class="list-item"><strong>${esc(x.text)}</strong><small>${x.type==='correct'?'Đúng':'Chưa đúng'}</small><div class="list-actions"><button class="secondary" data-edit-enc="${x.id}">Sửa</button><button class="danger" data-del-enc="${x.id}">Xóa</button></div></article>`).join('')}</div></section>`;
      if(adminTab==='characters')return `<div class="split"><form class="panel editor" id="char-form"><span class="eyebrow">Biên tập nhân vật</span><h3>Thêm nhân vật có nguồn</h3><div class="form-grid"><label class="field">Tên<input required name="name" /></label><label class="field">Vai trò<input name="role" /></label><label class="field">Năm sinh<input name="birthYear" /></label><label class="field">Năm mất<input name="deathYear" /></label><label class="field">Mảnh cần để mở<input name="fragmentTotal" type="number" min="1" value="12" /></label><label class="field">Nguồn<input required name="sourceName" /></label><label class="field full">URL nguồn<input required name="sourceUrl" type="url" placeholder="https://..." /></label><label class="field full">Tóm tắt<textarea required name="summary"></textarea></label><label class="field full">Timeline JSON <textarea name="timeline" placeholder='[{"year":"...","event":"..."}]'></textarea></label></div><button class="primary wide">Lưu nhân vật</button></form><section class="panel editor"><span class="eyebrow">Nhập hàng loạt</span><h3>JSON nhân vật</h3><p class="help">Dán mảng JSON. Mỗi phần tử phải có name, sourceName, sourceUrl, summary và fragmentTotal. Không có dữ liệu mẫu được tự chèn.</p><textarea id="char-json" class="control" style="min-height:260px" placeholder='[{"name":"...","sourceName":"...","sourceUrl":"https://...","summary":"...","fragmentTotal":12}]'></textarea><button class="primary wide" id="import-characters">Kiểm tra và nhập</button></section></div><section class="section"><div class="cards">${state.config.characters.map(c=>`<article class="panel card"><h3>${esc(c.name)}</h3><p>${esc(c.sourceName)}</p><div class="row"><button class="secondary" data-edit-char="${c.id}">Sửa</button><button class="danger" data-del-char="${c.id}">Xóa</button></div></article>`).join('')||'<div class="empty">Chưa có nhân vật được nhập.</div>'}</div></section>`;
      if(adminTab==='wheel')return `<div class="split"><form class="panel editor" id="reward-form"><span class="eyebrow">Phần thưởng</span><h3>Thêm phần thưởng vòng quay</h3><div class="form-grid"><label class="field">Tên<input required name="label" placeholder="Ví dụ: 50 XP" /></label><label class="field">Loại<select name="kind"><option value="xp">XP</option><option value="fragment">Mảnh ghép</option><option value="ticket">Vé quay</option><option value="badge">Huy hiệu</option></select></label><label class="field">Giá trị<input required type="number" name="value" min="0" value="20" /></label><label class="field">Trọng số<input required type="number" name="probability" min="0" value="20" /></label><label class="field">Màu<input required type="color" name="color" value="#d8941d" /></label></div><button class="primary wide">Thêm phần thưởng</button></form><section class="panel editor"><span class="eyebrow">Tỷ lệ hiện tại</span><h3>${state.config.wheelRewards.reduce((s,r)=>s+r.probability,0)} trọng số</h3><p class="muted">Xác suất được tính theo trọng số tương đối, không dùng phần thưởng cố định khi quay.</p></section></div><section class="section"><div class="list">${state.config.wheelRewards.map(r=>`<article class="list-item"><strong>${esc(r.label)} · ${r.value}</strong><small>${r.kind} · trọng số ${r.probability}</small><div class="list-actions"><button class="secondary" data-edit-reward="${r.id}">Sửa</button><button class="danger" data-del-reward="${r.id}">Xóa</button></div></article>`).join('')}</div></section>`;
      return `<section class="panel editor"><span class="eyebrow">Quyền theo vai trò</span><h3>Cấp tài khoản</h3><p class="help">Admin chỉ cấp Member; Founder có thể cấp Member, Admin hoặc Founder. Thông tin đăng nhập được băm SHA-256 trong trình duyệt của bản tự chứa này.</p><form id="account-form" class="form-grid"><label class="field">Tên<input required name="name" /></label><label class="field">Mã<input required name="code" /></label><label class="field">Mật khẩu<input required type="password" minlength="6" name="password" /></label><label class="field">Vai trò<select name="role"><option value="Member">Member</option>${founder?'<option value="Admin">Admin</option><option value="Founder">Founder</option>':''}</select></label><button class="primary full">Tạo tài khoản</button></form></section><section class="section"><div class="list">${state.accounts.map(a=>`<article class="list-item"><strong>${esc(a.name)} · ${esc(a.role)}</strong><small>Mã ${esc(a.code)}</small>${founder&&a.id!==account().id?`<div class="list-actions"><button class="danger" data-del-account="${a.id}">Xóa</button></div>`:''}</article>`).join('')}</div></section>`}
    function render(){document.documentElement.dataset.theme=state.theme;if(!state.active||!account()){login();return}const maps={dashboard,studio,library,quiz,progress,achievements,museum,wheel,account:accountView,admin};root.innerHTML=(maps[view]||dashboard)();bind()}
    const setView=v=>{view=v;flashSession=null;quizSession=null;render()};
    function bind(){document.querySelectorAll('[data-view],[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.view||b.dataset.go));$('#theme')?.addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()});$('#sound')?.addEventListener('click',()=>{state.sound=!state.sound;save();render()});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{studioKind=b.dataset.kind;render()});$('#studio-form')?.addEventListener('submit',promptAI);$('#regenerate-prompt')?.addEventListener('click',()=>$('#studio-form')?.requestSubmit());$('#copy-prompt')?.addEventListener('click',()=>navigator.clipboard.writeText($('#prompt-output')?.value||'').then(()=>toast('Đã sao chép prompt.','good')));$('#studio-file')?.addEventListener('change',async e=>{const file=e.target.files?.[0],note=$('#studio-file-note');if(!file)return;if(file.type==='text/plain'||file.name.endsWith('.txt')||file.name.endsWith('.md')){const text=(await file.text()).slice(0,120000),source=$('#studio-form [name=source]');if(source){source.value=text;source.dispatchEvent(new Event('input',{bubbles:true}))}if(note)note.textContent=`Đã đọc ${file.name} · ${text.length.toLocaleString('vi-VN')} ký tự.`}else if(note)note.textContent=`Đã chọn ${file.name}. Prompt sẽ nêu tệp PDF làm nguồn chính.`});$('#import-ai')?.addEventListener('click',importAI);$('#set-filter')?.addEventListener('input',e=>{libraryFilter=e.target.value.toLowerCase();render()});document.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>{flashSession={setId:b.dataset.study,index:0,mode:0,flip:false,done:0,remembered:0,mastered:[],start:Date.now()};render()});document.querySelectorAll('[data-quiz-set]').forEach(b=>b.onclick=()=>makeQuizFromSet(b.dataset.quizSet));document.querySelectorAll('[data-copy-set]').forEach(b=>b.onclick=()=>copySet(b.dataset.copySet));document.querySelectorAll('[data-delete-set]').forEach(b=>b.onclick=()=>deleteSet(b.dataset.deleteSet));$('#flash-card')?.addEventListener('click',()=>{flashSession.flip=!flashSession.flip;render()});$('#flash-prev')?.addEventListener('click',()=>{flashSession.index=(flashSession.index-1+profile().sets.find(x=>x.id===flashSession.setId).cards.length)%profile().sets.find(x=>x.id===flashSession.setId).cards.length;flashSession.flip=false;render()});$('#flash-next')?.addEventListener('click',()=>{flashSession.index=(flashSession.index+1)%profile().sets.find(x=>x.id===flashSession.setId).cards.length;flashSession.flip=false;render()});document.querySelectorAll('[data-flash-mode]').forEach(b=>b.onclick=()=>{flashSession.mode=Number(b.dataset.flashMode);render()});document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rateFlash(Number(b.dataset.rate)));$('#end-flash')?.addEventListener('click',endFlash);document.querySelectorAll('[data-start-quiz]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.startQuiz));document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{quizSession.answers[quizSession.index]=Number(b.dataset.answer);render()});$('#quiz-prev')?.addEventListener('click',()=>{quizSession.index=Math.max(0,quizSession.index-1);render()});$('#quiz-next')?.addEventListener('click',()=>{const s=profile().sets.find(x=>x.id===quizSession.setId);quizSession.index=Math.min(s.quiz.questions.length-1,quizSession.index+1);render()});$('#flag')?.addEventListener('click',()=>{const i=quizSession.index,at=quizSession.flagged.indexOf(i);at<0?quizSession.flagged.push(i):quizSession.flagged.splice(at,1);render()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{quizSession.index=Number(b.dataset.jump);render()});$('#submit-quiz')?.addEventListener('click',submitQuiz);document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claim(b.dataset.claim));document.querySelectorAll('[data-ach-filter]').forEach(b=>b.onclick=()=>{window._achFilter=b.dataset.achFilter;render()});$('#ach-search')?.addEventListener('input',e=>{window._achQuery=e.target.value;render()});$('#ach-status')?.addEventListener('change',e=>{window._achStatus=e.target.value;render()});$('#ach-difficulty')?.addEventListener('change',e=>{window._achDifficulty=e.target.value;render()});$('#ach-title')?.addEventListener('change',e=>{window._achTitleOnly=e.target.checked;render()});$('#ach-fragments')?.addEventListener('change',e=>{window._achFragmentOnly=e.target.checked;render()});document.querySelectorAll('[data-character]').forEach(b=>characterView(b.dataset.character));$('#spin')?.addEventListener('click',spin);$('#export')?.addEventListener('click',exportData);$('#import')?.addEventListener('change',importData);$('#logout')?.addEventListener('click',()=>{state.active=null;save();login()});document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.admin;render()});$('#enc-form')?.addEventListener('submit',addEnc);$('#ach-form')?.addEventListener('submit',addAchievement);$('#char-form')?.addEventListener('submit',addCharacter);$('#import-characters')?.addEventListener('click',importCharacters);$('#reward-form')?.addEventListener('submit',addReward);$('#account-form')?.addEventListener('submit',addAccount);document.querySelectorAll('[data-del-enc]').forEach(b=>b.onclick=()=>delConfig('encouragements',b.dataset.delEnc));document.querySelectorAll('[data-del-char]').forEach(b=>b.onclick=()=>delConfig('characters',b.dataset.delChar));document.querySelectorAll('[data-del-reward]').forEach(b=>b.onclick=()=>delConfig('wheelRewards',b.dataset.delReward));document.querySelectorAll('[data-del-account]').forEach(b=>b.onclick=()=>delAccount(b.dataset.delAccount));}
    document.addEventListener('click',e=>{const b=e.target.closest('[data-edit-enc],[data-edit-char],[data-edit-reward]');if(!b)return;if(b.dataset.editEnc)editEnc(b.dataset.editEnc);if(b.dataset.editChar)editCharacter(b.dataset.editChar);if(b.dataset.editReward)editReward(b.dataset.editReward)});
    function promptAI(e){e.preventDefault();const f=new FormData(e.currentTarget),file=f.get('source-file'),fileName=file&&file.name?file.name:'',sourceText=String(f.get('source')||''),source=fileName?(sourceText?`${sourceText}\n\nTệp đính kèm: ${fileName}. Hãy dùng tệp này làm nguồn chính.`:`Tệp đính kèm: ${fileName}. Hãy dùng tệp này làm nguồn chính.`):sourceText,count=Math.min(27,Math.max(1,Number(f.get('count'))||12)),kind=studioKind;const instruction=kind==='flashcard'?'Trả về JSON {"title":"...","cards":[{"front":"...","back":"...","note":"..."}]}':kind==='quiz'?'Trả về JSON {"title":"...","questions":[{"text":"...","options":["...","...","...","..."],"answer":0,"explanation":"..."}]}':'Trả về một JSON có cả khóa "flashcards" và "quiz" theo hai cấu trúc bên dưới.';const out=`Bạn là trợ lý biên soạn học tập. Môn: ${f.get('subject')}. Mục đích: ${f.get('goal')}. Lớp: ${f.get('grade')||'không nêu'}. Mức độ: ${f.get('difficulty')}. Nguồn: ${source}. ${instruction} Chỉ tạo tối đa ${count} mục. Với Quiz, thời gian gợi ý ${f.get('minutes')} phút. Không thêm văn bản ngoài JSON.`;navigator.clipboard?.writeText(out);const box=$('#prompt-output');box.value=out;box.classList.remove('hidden');$('#prompt-actions')?.classList.remove('hidden');toast('Đã tạo prompt. Bạn có thể chỉnh sửa, sao chép hoặc dán JSON phản hồi ở cột bên phải.','good')}
    function importAI(){const raw=$('#json-input').value.trim();try{const data=JSON.parse(raw);let count=0;if((studioKind==='flashcard'||studioKind==='both')&&(data.cards||data.flashcards)){const x=data.cards||data.flashcards;if(!Array.isArray(x)||x.length>27)throw Error('Flashcard phải là mảng tối đa 27 thẻ.');profile().sets.push({id:id(),title:data.title||'Bộ Flashcard mới',subject:'Tự tạo từ AI',cards:x.map(c=>({front:String(c.front||''),back:String(c.back||''),note:String(c.note||'')})).filter(c=>c.front&&c.back),learned:0,createdAt:new Date().toISOString()});count++}if((studioKind==='quiz'||studioKind==='both')&&(data.questions||data.quiz)){const q=data.questions||data.quiz.questions||data.quiz;if(!Array.isArray(q)||q.length>27)throw Error('Quiz phải là mảng tối đa 27 câu.');profile().sets.push({id:id(),title:data.quiz?.title||data.title||'Đề kiểm tra mới',subject:'Tự tạo từ AI',cards:[],learned:0,createdAt:new Date().toISOString(),quiz:{title:data.quiz?.title||data.title||'Đề kiểm tra mới',minutes:15,questions:q.map(x=>({text:String(x.text||''),options:(x.options||[]).map(String),answer:Number(x.answer)||0,explanation:String(x.explanation||'')})).filter(x=>x.text&&x.options.length>=2)}});count++}if(!count)throw Error('JSON không có cards hoặc questions phù hợp với lựa chọn hiện tại.');save();toast('Đã lưu '+count+' nội dung vào thư viện.','good');setView('library')}catch(err){toast('Không thể nhập JSON: '+err.message,'bad')}}
    function rateFlash(ok){const s=profile().sets.find(x=>x.id===flashSession.setId);if(ok){s.learned=Math.min(s.cards.length,(s.learned||0)+1);flashSession.remembered++;award(2,0)}flashSession.done++;flashSession.index=(flashSession.index+1)%s.cards.length;flashSession.flip=false;render()}
    function endFlash(){if(flashSession.done){addActivity('flashcard',flashSession.done,Math.floor((Date.now()-flashSession.start)/1000));save();toast(`Đã kết thúc phiên: ${flashSession.done} thẻ, ${flashSession.remembered} thẻ đã nhớ.`,'good')}flashSession=null;setView('library')}
    function makeQuizFromSet(setId){const s=profile().sets.find(x=>x.id===setId);if(!s||!s.cards.length)return toast('Bộ thẻ chưa có nội dung để tạo đề.','bad');const qs=s.cards.slice(0,27).map((c,i)=>{const other=s.cards.filter((_,j)=>j!==i).map(x=>x.back).sort(()=>Math.random()-.5).slice(0,3);const options=[c.back,...other].sort(()=>Math.random()-.5);return{text:c.front,options,answer:options.indexOf(c.back),explanation:c.note||'Đáp án được lấy từ mặt sau Flashcard.'}});s.quiz={title:'Đề từ bộ: '+s.title,minutes:Math.max(5,Math.ceil(qs.length*1.3)),questions:qs};save();toast('Đã tạo đề từ Flashcard.','good');setView('quiz')}
    function copySet(setId){const s=profile().sets.find(x=>x.id===setId);profile().sets.push({...structuredClone(s),id:id(),title:s.title+' (bản sao)',createdAt:new Date().toISOString(),learned:0});save();toast('Đã sao chép bộ Flashcard.','good');render()}
    function deleteSet(setId){if(!confirm('Xóa bộ Flashcard này?'))return;profile().sets=profile().sets.filter(x=>x.id!==setId);save();render()}
    function startQuiz(setId){const s=profile().sets.find(x=>x.id===setId);quizSession={setId,index:0,answers:{},flagged:[],end:Date.now()+s.quiz.minutes*60000,start:Date.now()};render();quizSession.timer=setInterval(()=>{const n=$('#timer');if(n)n.textContent=timeLeft();if(Date.now()>=quizSession.end){clearInterval(quizSession.timer);submitQuiz()}},1000)}
    function submitQuiz(){if(!quizSession)return;clearInterval(quizSession.timer);const s=profile().sets.find(x=>x.id===quizSession.setId),answers=quizSession.answers,correct=s.quiz.questions.reduce((n,q,i)=>n+(answers[i]===q.answer),0),total=s.quiz.questions.length,skipped=total-Object.keys(answers).length,score=Math.round(correct/total*100),result={id:id(),quizId:s.id,title:s.quiz.title,completedAt:new Date().toISOString(),score,score10:(score/10).toFixed(1),correct,total,skipped,answers,flagged:[...quizSession.flagged],questions:s.quiz.questions,seconds:Math.floor((Date.now()-quizSession.start)/1000)};profile().attempts.push(result);addActivity('quiz',total,result.seconds);award(Math.max(5,correct*5),correct?1:0);save();quizSession=null;root.innerHTML=resultView(result);bind()}
    function claim(aid){const a=[...generatedAchievements(),...state.config.customAchievements].find(x=>x.id===aid),p=profile();if(!a||p.claimed.includes(aid))return;p.claimed.push(aid);award(a.rewardXp||a.tier*5,a.rewardFragments||0,'Đã nhận phần thưởng thành tích.');render()}
    const answerKey=v=>String(v??'').trim().toLocaleLowerCase('vi').replace(/\s+/g,' ');
    function checkFlashAnswer(given){if(!flashSession)return;const s=profile().sets.find(x=>x.id===flashSession.setId),c=s?.cards[flashSession.index];if(!c)return;flashSession.mastered??=[];if(answerKey(given)===answerKey(c.back)){const key=`${s.id}:${flashSession.index}:${flashSession.mode}`;if(!flashSession.mastered.includes(key)){flashSession.mastered.push(key);award(2,0)}flashSession.flip=true;toast('Chính xác. Đáp án đã được mở khóa.','good');render()}else toast('Chưa khớp. Hãy đối chiếu kiến thức và thử lại.','bad')}
    function retryQuiz(){const last=profile().attempts.at(-1);if(!last||!last.quizId)return toast('Chưa có đề vừa làm để thực hiện lại.','bad');startQuiz(last.quizId)}
    function makeWrongCards(){const last=profile().attempts.at(-1);if(!last)return toast('Chưa có kết quả để tạo Flashcard.','bad');const cards=last.questions.filter((q,i)=>last.answers[i]!==q.answer).map(q=>({front:q.text,back:q.options[q.answer]||'Đáp án chưa có',note:q.explanation||'Ôn lại câu hỏi này.'}));if(!cards.length)return toast('Bạn đã trả lời đúng toàn bộ câu hỏi; chưa cần tạo bộ ôn lại.','good');profile().sets.push({id:id(),title:'Ôn lại: '+last.title,subject:'Câu sai từ Quiz',cards,learned:0,createdAt:new Date().toISOString()});save();toast('Đã tạo '+cards.length+' Flashcard từ câu chưa đúng.','good');setView('library')}
    document.addEventListener('click',e=>{const b=e.target.closest('[data-subject],[data-period],[data-rename-set]');if(!b)return;if(b.dataset.subject!==undefined){librarySubject=b.dataset.subject;render();return}if(b.dataset.period!==undefined){libraryPeriod=b.dataset.period;render();return}const s=profile().sets.find(x=>x.id===b.dataset.renameSet),next=s&&prompt('Đổi tên bộ Flashcard:',s.title);if(next&&next.trim()){s.title=next.trim();save();toast('Đã đổi tên bộ Flashcard.','good');render()}});
    document.addEventListener('click',e=>{const b=e.target.closest('[data-flash-choice],#check-typed,#check-match');if(!b)return;if(b.dataset.flashChoice!==undefined)return checkFlashAnswer(b.dataset.flashChoice);if(b.id==='check-typed')return checkFlashAnswer($('#typed-answer')?.value);if(b.id==='check-match')return checkFlashAnswer($('#match-answer')?.value)});
    document.addEventListener('click',e=>{const b=e.target.closest('#retry-quiz,#make-wrong-cards');if(!b)return;if(b.id==='retry-quiz')retryQuiz();if(b.id==='make-wrong-cards')makeWrongCards()});
    function characterView(cid){const c=state.config.characters.find(x=>x.id===cid);if(c){root.innerHTML=character(c);bind()}}
    function spin(){const p=profile();if(!p.tickets)return;const w=$('#wheel'),rewards=state.config.wheelRewards,total=rewards.reduce((s,r)=>s+r.probability,0);if(!total)return toast('Admin cần cấu hình ít nhất một trọng số lớn hơn 0.','bad');let r=Math.random()*total,win=rewards.find(x=>(r-=x.probability)<=0)||rewards[0];p.tickets--;w.style.transform=`rotate(${1440+Math.floor(Math.random()*720)}deg)`;setTimeout(()=>{if(win.kind==='xp')award(win.value,0);if(win.kind==='fragment')award(0,win.value);if(win.kind==='ticket')p.tickets+=win.value;addActivity('reward',1);save();$('#spin-result').textContent='Bạn nhận được: '+win.label;beep();render()},2750)}
    function beep(){if(!state.sound)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.setValueAtTime(.05,a.currentTime);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch{}}
    function exportData(){const a=document.createElement('a'),blob=new Blob([JSON.stringify({profile:profile(),exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='study-historia-backup.json';a.click();URL.revokeObjectURL(a.href)}
    function importData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.profile||typeof d.profile!=='object')throw Error();state.profiles[state.active]={...blankProfile(),...d.profile};save();toast('Đã nhập dữ liệu cá nhân.','good');render()}catch{toast('Tệp JSON không hợp lệ.','bad')}};r.readAsText(f)}
    function addEnc(e){e.preventDefault();const f=new FormData(e.currentTarget);state.config.encouragements.push({id:id(),text:String(f.get('text')).trim(),type:String(f.get('type')),enabled:true});save();toast('Đã thêm lời động viên.','good');render()}
    function addAchievement(e){e.preventDefault();const f=new FormData(e.currentTarget);state.config.customAchievements.push({id:id(),name:String(f.get('name')).trim(),metric:String(f.get('metric')),threshold:Number(f.get('threshold')),rewardXp:Number(f.get('rewardXp')),description:'Mốc do quản trị viên tạo',enabled:true});save();toast('Đã thêm thành tích tùy chỉnh.','good');render()}
    function addCharacter(e){e.preventDefault();const f=new FormData(e.currentTarget);let timeline=[];try{timeline=f.get('timeline')?JSON.parse(f.get('timeline')):[]}catch{return toast('Timeline JSON không hợp lệ.','bad')}state.config.characters.push({id:id(),name:String(f.get('name')).trim(),role:String(f.get('role')),birthYear:String(f.get('birthYear')),deathYear:String(f.get('deathYear')),fragmentTotal:Number(f.get('fragmentTotal')),sourceName:String(f.get('sourceName')).trim(),sourceUrl:String(f.get('sourceUrl')).trim(),summary:String(f.get('summary')).trim(),timeline});save();toast('Đã lưu nhân vật có nguồn.','good');render()}
    function importCharacters(){try{const arr=JSON.parse($('#char-json').value);if(!Array.isArray(arr)||!arr.length)throw Error('Cần một mảng JSON có ít nhất một nhân vật.');const clean=arr.map(c=>{if(!c.name||!c.sourceName||!c.sourceUrl||!c.summary||!Number(c.fragmentTotal)||!/^https?:\/\//.test(c.sourceUrl))throw Error('Thiếu name/sourceName/sourceUrl/summary/fragmentTotal hợp lệ.');return{...c,id:c.id||id(),timeline:Array.isArray(c.timeline)?c.timeline:[]}});state.config.characters.push(...clean);save();toast('Đã nhập '+clean.length+' nhân vật.','good');render()}catch(e){toast('Không thể nhập: '+e.message,'bad')}}
    function addReward(e){e.preventDefault();const f=new FormData(e.currentTarget);state.config.wheelRewards.push({id:id(),label:String(f.get('label')).trim(),kind:String(f.get('kind')),value:Number(f.get('value')),probability:Number(f.get('probability')),color:String(f.get('color'))});save();toast('Đã thêm phần thưởng.','good');render()}
    async function addAccount(e){e.preventDefault();const f=new FormData(e.currentTarget),role=String(f.get('role')),code=String(f.get('code')).trim().toUpperCase();if(account().role!=='Founder'&&role!=='Member')return toast('Admin chỉ có thể tạo Member.','bad');if(state.accounts.some(a=>a.code===code))return toast('Mã tài khoản đã tồn tại.','bad');const a={id:id(),name:String(f.get('name')).trim(),code,role,hash:await hash(String(f.get('password'))),createdAt:new Date().toISOString()};state.accounts.push(a);state.profiles[a.id]=blankProfile();save();toast('Đã tạo tài khoản '+role+'.','good');render()}
    function editEnc(eid){const x=state.config.encouragements.find(v=>v.id===eid);if(!x)return;const text=prompt('Chỉnh sửa lời động viên:',x.text);if(text===null)return;const type=prompt('Tình huống: correct hoặc incorrect',x.type);if(type===null)return;if(!text.trim()||!['correct','incorrect'].includes(type.trim()))return toast('Nội dung hoặc tình huống không hợp lệ.','bad');x.text=text.trim();x.type=type.trim();save();toast('Đã cập nhật lời động viên.','good');render()}
    function editCharacter(cid){const c=state.config.characters.find(v=>v.id===cid);if(!c)return;const summary=prompt('Chỉnh sửa tóm tắt:',c.summary||'');if(summary===null)return;const sourceUrl=prompt('Chỉnh sửa URL nguồn:',c.sourceUrl||'');if(sourceUrl===null)return;if(!summary.trim()||!/^https?:\/\//.test(sourceUrl.trim()))return toast('Tóm tắt và URL nguồn hợp lệ là bắt buộc.','bad');c.summary=summary.trim();c.sourceUrl=sourceUrl.trim();save();toast('Đã cập nhật nhân vật.','good');render()}
    function editReward(rid){const r=state.config.wheelRewards.find(v=>v.id===rid);if(!r)return;const label=prompt('Chỉnh sửa tên phần thưởng:',r.label);if(label===null)return;const value=prompt('Chỉnh sửa giá trị:',r.value);if(value===null)return;const probability=prompt('Chỉnh sửa trọng số:',r.probability);if(probability===null)return;if(!label.trim()||Number(value)<0||Number(probability)<0)return toast('Giá trị hoặc trọng số không hợp lệ.','bad');r.label=label.trim();r.value=Number(value);r.probability=Number(probability);save();toast('Đã cập nhật phần thưởng.','good');render()}
    function delConfig(key,value){if(!confirm('Xóa mục này?'))return;state.config[key]=state.config[key].filter(x=>x.id!==value);save();render()}
    function delAccount(aid){const target=state.accounts.find(a=>a.id===aid);if(!target||account().role!=='Founder'||target.role==='Founder')return toast('Founder không thể xóa Founder khác.','bad');if(!confirm('Xóa tài khoản và dữ liệu học tập của tài khoản này?'))return;state.accounts=state.accounts.filter(a=>a.id!==aid);delete state.profiles[aid];save();render()}
    render();
  })();
